name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect backend project
        id: backend
        shell: bash
        run: |
          if [[ -f requirements-dev.txt && -f app/main.py ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.backend.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        if: steps.backend.outputs.exists == 'true'
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        if: steps.backend.outputs.exists == 'true'
        run: python -m compileall .

      - name: Import application
        if: steps.backend.outputs.exists == 'true'
        run: python -c "from app.main import app; assert app.title == 'FDE Portfolio API'"

      - name: Test
        if: steps.backend.outputs.exists == 'true'
        run: python -m unittest discover -s tests -v

      - name: Report uninitialized backend
        if: steps.backend.outputs.exists != 'true'
        run: echo "Backend project has not been initialized yet."

name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect backend project
        id: backend
        shell: bash
        run: |
          if [[ -f pyproject.toml && -f uv.lock && -f app/main.py ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.backend.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        if: steps.backend.outputs.exists == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        if: steps.backend.outputs.exists == 'true'
        run: uv sync --locked --dev

      - name: Check Python formatting
        if: steps.backend.outputs.exists == 'true'
        run: uv run --locked ruff format --check app scripts tests

      - name: Lint Python sources
        if: steps.backend.outputs.exists == 'true'
        run: uv run --locked ruff check app scripts tests

      - name: Type-check Python sources
        if: steps.backend.outputs.exists == 'true'
        run: uv run --locked mypy app scripts tests

      - name: Compile Python sources
        if: steps.backend.outputs.exists == 'true'
        run: uv run --locked python -m compileall app scripts tests

      - name: Import application
        if: steps.backend.outputs.exists == 'true'
        run: uv run --locked python -c "from app.main import app; assert app.title == 'ASVS Requirement Search API'"

      - name: Test
        if: steps.backend.outputs.exists == 'true'
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Report uninitialized backend
        if: steps.backend.outputs.exists != 'true'
        run: echo "Backend project has not been initialized yet."

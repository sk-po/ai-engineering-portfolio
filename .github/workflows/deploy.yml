# Azureへのデプロイ（GitHub Actions → Azure, OIDC）。
#
# 認証はOIDC（federated credential）を使い、client secretを保存しません（P08準拠）。
# このワークフローはAzure側のリソースを作れないため、事前に次を1回だけ用意します。
#
# 前提（1回だけ）:
#   1. Microsoft Entra アプリ登録を作成し、GitHub用のfederated credentialを追加
#        subject例: repo:<owner>/<repo>:ref:refs/heads/main
#                   repo:<owner>/<repo>:environment:production  など運用に合わせる
#   2. そのアプリのサービスプリンシパルへ、対象リソースグループで権限を付与
#        - Contributor（デプロイとACRビルド）
#        - Role Based Access Control Administrator（テンプレートがロール割り当てを作るため）
#        ※ まとめてOwnerでも可。最小権限なら上記2つ。
#
# 必要なGitHub設定:
#   Variables（非機密）: AZURE_RESOURCE_GROUP, AZURE_CONTAINER_REGISTRY, AZURE_DEPLOYMENT_NAME(任意)
#   Secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#
# OpenAI APIキーはCIで扱いません。Key VaultのシークレットOPENAI-API-KEYを正本とし、
# デプロイ前に一度だけ投入します（以後キーレス再デプロイでも上書きされません）:
#   az keyvault secret set --vault-name <kv> --name OPENAI-API-KEY --value <key>
# backendはManaged Identity経由でこのシークレットを解決します。
#
# コスト配慮のため自動トリガーは付けず、手動実行（workflow_dispatch）のみにしています。

name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "コンテナイメージのタグ。空ならコミットSHAを使用。"
        required: false
        default: ""
      deploy_apps:
        description: "Container Apps（frontend/backend）もデプロイする"
        type: boolean
        required: false
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      DEPLOYMENT_NAME: ${{ vars.AZURE_DEPLOYMENT_NAME || 'asvs-rag-dev' }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        if: ${{ inputs.deploy_apps }}
        uses: docker/setup-buildx-action@v3

      - name: Build and push images to ACR
        if: ${{ inputs.deploy_apps }}
        run: |
          set -euo pipefail
          # ACRのclassicビルダーはBuildKit非対応のため、BuildKitを持つランナー上で
          # buildxビルドしてpushする。DockerfileのRUN --mount(secret/cache)が使える。
          login_server="${ACR_NAME}.azurecr.io"
          az acr login --name "$ACR_NAME"
          docker buildx build --push --target runtime \
            --tag "${login_server}/asvs-backend:${IMAGE_TAG}" ./backend
          docker buildx build --push --target runtime \
            --tag "${login_server}/asvs-frontend:${IMAGE_TAG}" ./frontend

      - name: Deploy Bicep
        run: |
          set -euo pipefail
          # OpenAI APIキーはCIで渡さない。空のままなのでBicepはKey Vaultの
          # 既存シークレット(OPENAI-API-KEY)を保持する（上書きしない）。
          params=(deployContainerApps=${{ inputs.deploy_apps }})
          if [[ "${{ inputs.deploy_apps }}" == "true" ]]; then
            login_server="${ACR_NAME}.azurecr.io"
            params+=("backendImage=${login_server}/asvs-backend:${IMAGE_TAG}")
            params+=("frontendImage=${login_server}/asvs-frontend:${IMAGE_TAG}")
          fi
          az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file ./infra/main.bicep \
            --parameters ./infra/environments/dev.bicepparam \
            --parameters "${params[@]}"

      - name: Report frontend URL
        if: ${{ inputs.deploy_apps }}
        run: |
          set -euo pipefail
          url=$(az deployment group show \
            --name "$DEPLOYMENT_NAME" --resource-group "$RESOURCE_GROUP" \
            --query 'properties.outputs.frontendUrl.value' -o tsv)
          echo "### Deployed frontend: ${url}" >> "$GITHUB_STEP_SUMMARY"
